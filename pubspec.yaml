name: prayer_clock
description: "Remote control for the custom P4 Prayer Clock over Bluetooth LE and WiFi HTTP."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  flutter_blue_plus: ^1.35.2
  shared_preferences: ^2.3.3
  flutter_local_notifications: ^18.0.1
  share_plus: ^10.1.2
  file_picker: ^8.1.4
  path_provider: ^2.1.5
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
